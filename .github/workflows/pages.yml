name: Deploy to GitHub Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm run build
        env:
          NITRO_PRESET: static
          VITE_BASE_URL: /magic-resume/

      - name: Locate output directory
        id: outdir
        run: |
          if [ -d ".output/public" ]; then
            echo "dir=.output/public" >> $GITHUB_OUTPUT
          elif [ -d "dist/client" ]; then
            echo "dir=dist/client" >> $GITHUB_OUTPUT
          else
            echo "Available dirs:" && ls -la
            exit 1
          fi

      - name: Add .nojekyll and SPA 404 fallback
        run: |
          touch ${{ steps.outdir.outputs.dir }}/.nojekyll
          cp ${{ steps.outdir.outputs.dir }}/index.html ${{ steps.outdir.outputs.dir }}/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.outdir.outputs.dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
