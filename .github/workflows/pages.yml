name: Deploy to GitHub Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm run build
        env:
          NITRO_PRESET: static
          VITE_BASE_URL: /magic-resume/

      - name: Inspect build output
        run: |
          echo "=== root ===" && ls -la
          echo "=== dist/ ===" && find dist -maxdepth 3 2>/dev/null | head -60 || echo "(no dist/)"
          echo "=== .output/ ===" && find .output -maxdepth 3 2>/dev/null | head -60 || echo "(no .output/)"

      - name: Locate or create index.html
        id: outdir
        run: |
          # Best case: Nitro static preset created .output/public with index.html
          if [ -f ".output/public/index.html" ]; then
            echo "dir=.output/public" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Fallback: pre-render by running the built server briefly
          echo "No static index.html found — pre-rendering via built server"
          node server.mjs &
          SERVER_PID=$!
          # Wait for the server to be ready
          for i in $(seq 1 15); do
            curl -sf http://localhost:3000/ > /dev/null && break
            sleep 1
          done
          mkdir -p _site
          # Copy all client assets
          cp -r dist/client/. _site/
          # Capture server-rendered HTML for the root route
          curl -sf http://localhost:3000/ -o _site/index.html
          kill $SERVER_PID || true
          echo "dir=_site" >> $GITHUB_OUTPUT

      - name: Add .nojekyll and SPA 404 fallback
        run: |
          touch ${{ steps.outdir.outputs.dir }}/.nojekyll
          cp ${{ steps.outdir.outputs.dir }}/index.html ${{ steps.outdir.outputs.dir }}/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.outdir.outputs.dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
